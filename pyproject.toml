[project]
name = "pokedex-forge-api"
version = "0.1.0"
description = "FastAPI backend for Pokedex Forge"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.1",
    "asyncpg==0.31.0",
    "debugpy==1.8.8",
    "email-validator==2.3.0",
    "fastapi==0.128.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pwdlib[argon2,bcrypt]==0.3.0",
    "PyJWT==2.10.1",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.22",
    "SQLAlchemy==2.0.46",
    "uvicorn==0.40.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.5.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.14.14",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
